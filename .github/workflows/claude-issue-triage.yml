# First-pass triage of new BERVO issues: label them, and check whether a term
# request is already satisfied by an existing term.

name: Claude Issue Triage

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage
        required: true
      model:
        description: Model override for this run
        required: false
        default: ''

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLAUDE_AUTH: ${{ (secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '') && 'true' || 'false' }}
      ISSUE_NUMBER: ${{ github.event.inputs.issue || github.event.issue.number }}
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve agent config
        uses: ./.github/actions/resolve-agent-config
        with:
          workflow: claude-issue-triage
          model-override: ${{ github.event.inputs.model }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install just
        run: curl -fsSL https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      # Posting identity. With the App secrets set, comments and git operations
      # come from the app (e.g. "ai4c-agent") instead of the generic
      # "github-actions[bot]". continue-on-error means the step is a no-op when
      # the secrets are absent, and the workflow falls back to github.token.
      - name: Generate agent app token
        id: agent-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AI4C_AGENT_APP_ID }}
          private-key: ${{ secrets.AI4C_AGENT_PRIVATE_KEY }}

      - name: Resolve Claude auth
        if: env.HAS_CLAUDE_AUTH == 'true'
        uses: ./.github/actions/resolve-claude-auth
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ env.AGENT_MODEL }}

      - name: Triage
        if: env.AUTH_MODE != 'none' && env.AUTH_MODE != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ env.AUTH_MODE == 'api_key' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ env.AUTH_MODE == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          github_token: ${{ steps.agent-token.outputs.token || github.token }}
          # The action has no `model:` input; it must go through claude_args.
          claude_args: |
            --model ${{ env.AGENT_MODEL }}
            --allowedTools "Bash(just find:*),Bash(just show:*),Bash(gh issue:*),Bash(gh label:*)"
          prompt: |
            Triage BERVO issue #${{ env.ISSUE_NUMBER }}.

            Read it with `gh issue view ${{ env.ISSUE_NUMBER }}`.

            1. Classify it: new term request, definition or metadata fix, bug in the
               build or tooling, documentation, or question.
            2. If it is a term request, search the ontology with
               `just find "<label>"` for the requested label and any synonyms.
               If an existing term already covers it, say so explicitly and name the
               ID — this closes a large share of term requests.
            3. Note what the issue is missing against CONTRIBUTING.md: a proposed
               label, a definition, or a suggested parent.
            4. Apply appropriate existing labels with `gh issue edit`. Only use
               labels that already exist in the repository; do not create new ones.
            5. Post one short comment with your assessment.

            Be brief. Do not attempt to implement the change, and do not close the
            issue.
